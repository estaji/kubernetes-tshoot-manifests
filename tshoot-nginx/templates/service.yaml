apiVersion: v1
kind: Service
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels" . | nindent 4 }}
spec:
  selector:
    {{- include "labels" . | nindent 4 }}
  type: {{ .Values.app.service.type }}
  ports:
  - name: http
    port: {{ .Values.app.service.port }}
    targetPort: {{ .Values.app.service.port }}
