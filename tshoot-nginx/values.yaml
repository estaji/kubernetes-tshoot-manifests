app:
  deployment:
    image_tag: "stable-alpine3.20"
    replicas: 2
    port: 80
    resources:
      requests:
        cpu: "0.5"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "1Gi"

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    ingressClassName: nginx
    host: nginx.omid.local
    path: /
