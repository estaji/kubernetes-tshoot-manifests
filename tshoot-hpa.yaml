# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-test-deployment
  namespace: omid
  labels:
    app: hpa-test
spec:
  replicas: 1 # Start with 1 replica
  selector:
    matchLabels:
      app: hpa-test
  template:
    metadata:
      labels:
        app: hpa-test
    spec:
      containers:
      - name: hpa-test-container
        image: nginx:latest # A lightweight image for testing
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m" # Request 100 millicores
          limits:
            cpu: "200m" # Limit to 200 millicores (important for HPA to detect high usage)
---
# service.yaml
apiVersion: v1
kind: Service
metadata:
  name: hpa-test-service
  namespace: omid
spec:
  selector:
    app: hpa-test
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP # Use ClusterIP for internal access
---
# hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-test-hpa
  namespace: omid
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-test-deployment
  minReplicas: 1 # Minimum number of pods
  maxReplicas: 5 # Maximum number of pods
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50 # Target 50% CPU utilization
