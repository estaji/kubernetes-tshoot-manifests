apiVersion: v1
kind: Pod
metadata:
  name: test-postgres
  namespace: mynamespace
spec:
  nodeName: worker-4
  containers:
  - name: test
    image: andreswebs/postgresql-client
    command: ["/bin/sh"]
    args: ["-c", "while true; do ping localhost; sleep 60;done"]
    envFrom:
    - secretRef:
        name: app-secrets
    resources:
      requests:
        cpu: "0.5"
        memory: "500Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
