apiVersion: v1
kind: Pod
metadata:
  name: omid-curl
  namespace: omid
spec:
  #nodeName: nop-worker-1
  containers:
  - name: omid-curl
    image: curlimages/curl:8.15.0
    command: ["/bin/sh"]
    args: ["-c", "while true; do ping localhost; sleep 60;done"]
    resources:
      requests:
        cpu: "0.5"
        memory: "500Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
